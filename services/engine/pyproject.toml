[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacylint-engine"
version = "0.2.0"
description = "Deterministic DPDP privacy scanner and SARIF exporter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "tree-sitter-language-pack==1.25.2",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.6,<4",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "asyncpg>=0.30,<1",
  "networkx>=3.4,<4",
  "neo4j>=5.26,<7",
  "Pillow>=10,<13",
]

[project.scripts]
privacylint = "app.cli:main"

[tool.setuptools]
packages = ["app"]
